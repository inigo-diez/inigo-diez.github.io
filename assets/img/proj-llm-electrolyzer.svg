  <rect width="1200" height="600" fill="url(#background)"/>
  <g opacity=".12" fill="none" stroke="#fff" stroke-width="2">
    <path d="M0 95h1200M0 205h1200M0 315h1200M0 425h1200M0 535h1200"/>
